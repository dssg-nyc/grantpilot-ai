# GrantPilot — single-VPS production stack.
#
#   cd deploy && cp .env.example .env && ./generate-keys.sh   # then edit .env
#   docker compose up -d --build
#   docker compose --profile studio up -d                     # optional Supabase Studio
#
# Self-hosted Supabase subset (db, auth, rest, kong; meta + studio behind the
# "studio" profile) is adapted from supabase/supabase docker/docker-compose.yml
# and docker-compose.kong.yml (master, 2026-10). Realtime, Storage, Edge
# Functions, Supavisor and analytics are omitted — the app doesn't use them.
#
# Only Caddy publishes ports to the internet (80/443). Kong and Postgres bind to
# 127.0.0.1 for SSH-tunnel access (Studio, psql, pg_dump).

name: grantpilot

x-app-env: &app-env
  NODE_ENV: production
  # Supabase (self-hosted). The browser and the server both use the public URL so
  # auth cookies (named after its host) match; Caddy's network alias below keeps
  # server-side calls on the Docker network instead of hairpinning out.
  NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
  SUPABASE_JWT_SECRET: ${JWT_SECRET}
  # Direct Postgres connection (pg-boss queue + crons)
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
  # Local embeddings
  OLLAMA_URL: http://ollama:11434
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
  # Paid APIs we keep
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  RESEND_API_KEY: ${RESEND_API_KEY}
  EMAIL_FROM: ${EMAIL_FROM}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
  SAM_GOV_API_KEY: ${SAM_GOV_API_KEY:-}
  RSS_FEED_URLS: ${RSS_FEED_URLS:-}
  # App
  NEXT_PUBLIC_APP_URL: ${SITE_URL}
  NEXT_PUBLIC_APP_NAME: ${APP_NAME:-GrantPilot AI}
  CRON_SECRET: ${CRON_SECRET}

services:
  # ---------------------------------------------------------------------------
  # Supabase
  # ---------------------------------------------------------------------------
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - ./supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  # Applies supabase/migrations/*.sql once each (tracked in _grantpilot.schema_migrations).
  migrate:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../supabase/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      MIGRATIONS_DIR: /migrations
    entrypoint: ["bash", "/migrate.sh"]

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}/auth/v1

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${SITE_URL}
      # The app's OAuth/email-confirm/password-reset redirects all land here.
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**${ADDITIONAL_REDIRECT_URLS:+,${ADDITIONAL_REDIRECT_URLS}}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}/auth/v1

      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-GrantPilot AI}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      # Google sign-in (components/auth/OAuthButtons.tsx). The button is always
      # rendered; with GOOGLE_ENABLED=false GoTrue rejects the provider.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  kong:
    image: kong/kong:3.9.3
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - 127.0.0.1:${KONG_HOST_PORT:-8000}:8000
    volumes:
      - ./supabase/kong.yml:/home/kong/temp.yml:ro,z
      - ./supabase/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY:?run ./generate-keys.sh}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?run ./generate-keys.sh}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in deploy/.env}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

  # Optional admin UI: `docker compose --profile studio up -d`, then
  # `ssh -L 8000:127.0.0.1:8000 vps` and open http://localhost:8000 (basic auth).
  meta:
    image: supabase/postgres-meta:v0.100.0
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-}

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    profiles: [studio]
    restart: unless-stopped
    depends_on:
      - meta
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-}
      PGRST_DB_SCHEMAS: public
      DEFAULT_ORGANIZATION_NAME: GrantPilot
      DEFAULT_PROJECT_NAME: GrantPilot
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:${KONG_HOST_PORT:-8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  # ---------------------------------------------------------------------------
  # Embeddings (bge-m3, 1024-dim — matches the vector(1024) columns)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: pulls the embedding model into the shared volume (no-op once cached).
  ollama-pull:
    image: ollama/ollama:0.40.13
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${EMBEDDING_MODEL:-bge-m3}"]

  # ---------------------------------------------------------------------------
  # GrantPilot
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: app
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time.
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${SITE_URL}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-GrantPilot AI}
    image: grantpilot-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
    environment:
      <<: *app-env
      HOSTNAME: 0.0.0.0
      PORT: 3000

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    image: grantpilot-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # worker/index.ts waits up to 30s for running jobs on SIGTERM.
    stop_grace_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      <<: *app-env

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - app
      - kong
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    networks:
      default:
        # Containers resolving the public domain (app/worker calling Supabase via
        # NEXT_PUBLIC_SUPABASE_URL) reach Caddy directly over the Docker network.
        aliases:
          - ${APP_DOMAIN:?set APP_DOMAIN in deploy/.env}
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  db-config:
  ollama-models:
  caddy-data:
  caddy-config:
